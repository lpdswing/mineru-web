# Docker Compose - NVIDIA V100 (amd64) 离线部署版本
# 适用于无法访问外网的 V100(x86_64)服务器。所有镜像必须事先 docker load 进本地。
#
# 与 docker-compose.yml(联网 NVIDIA 版)的差异:
#   - 全部服务 pull_policy: never,避免 compose 尝试 pull 卡住
#   - backend/worker 去掉 dev 挂载 ./backend:/app(跑镜像内代码,消除 entrypoint.sh
#     的 +x/CRLF 权限问题);DB 改落到 ./data 卷持久化
#
# 前置:已通过 scripts/build-v100-offline.sh(联网机)产出 v100-offline-bundle/,
#       传到 V100 后用 deploy-v100.sh 载入镜像并启动。
# 启动:./deploy-v100.sh
#       或 docker compose --env-file .env -f docker-compose.v100.offline.yml up -d
#
# ⚠️ V100 = sm_70、不支持 bf16。mineru-api 镜像基座 vllm/vllm-openai:v0.21.0 较新,
#    hybrid/vlm 后端可能因 vLLM 不支持 sm_70 而失败。pipeline(PaddleOCR,不依赖 vLLM)
#    在 V100 上稳跑——前端上传时优先选 pipeline。详见 docs/deployment.md。

services:
  frontend:
    image: lpdswing/mineru-web-frontend:v3.4.4
    pull_policy: never
    ports:
      - "8088:80"
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - backend
      - minio
    networks:
      - mineru-network

  backend:
    image: lpdswing/mineru-web-backend:v3.4.4
    pull_policy: never
    environment:
      - TZ=Asia/Shanghai
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:?set MINIO_ENDPOINT to a host address reachable by browser and containers, e.g. SERVER_IP:9000}
      # DB 落到挂载的 ./data 卷,recreate 不丢;app 与 alembic 都读此 env
      - DATABASE_URL=sqlite:///./data/mineru.db
      - MINERU_API_URL=http://mineru-router:8002
      - MINERU_API_HYBRID_EFFORT=${MINERU_API_HYBRID_EFFORT:-high}
      - SERVER_URL=${SERVER_URL:-}
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mineru-router:
        condition: service_healthy
    networks:
      - mineru-network

  worker:
    image: lpdswing/mineru-web-backend:v3.4.4
    pull_policy: never
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    command: python3 run_worker.py
    environment:
      - TZ=Asia/Shanghai
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:?set MINIO_ENDPOINT to a host address reachable by browser and containers, e.g. SERVER_IP:9000}
      - DATABASE_URL=sqlite:///./data/mineru.db
      - MINERU_API_URL=http://mineru-router:8002
      - MINERU_API_HYBRID_EFFORT=${MINERU_API_HYBRID_EFFORT:-high}
      - SERVER_URL=${SERVER_URL:-}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-1}
      - MINERU_API_USE_ASYNC_TASKS=${MINERU_API_USE_ASYNC_TASKS:-0}
      - POPO_ENABLED=${POPO_ENABLED:-0}
      - POPO_API_URL=${POPO_API_URL:-http://popo-postprocessor:8010}
      - POPO_TIMEOUT_SECONDS=${POPO_TIMEOUT_SECONDS:-1800}
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mineru-router:
        condition: service_healthy
    networks:
      - mineru-network

  mcp:
    # MCP 服务把后端 API 暴露给 LLM 客户端(Claude Code 等)。默认不随 `up` 启动;
    # 显式启用:docker compose --env-file .env -f docker-compose.v100.offline.yml --profile mcp up -d mcp
    # 镜像由 build-v100-offline.sh 在联网机构建并打进 bundle(images/ 里的 tar)。
    profiles: ["mcp"]
    image: mineru-web-mcp:v3.4.4
    pull_policy: never
    container_name: mcp
    ports:
      - "8001:8001"
    environment:
      TZ: Asia/Shanghai
      BACKEND_URL: http://backend:8000
      MINERU_AUTH_USER: ${MINERU_AUTH_USER:-}
      MINERU_AUTH_PASS: ${MINERU_AUTH_PASS:-}
    volumes:
      - ./inbox:/inbox:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - mineru-network

  mineru-router:
    image: lpdswing/mineru-web-mineru-api:v3.4.4
    pull_policy: never
    container_name: mineru-router
    restart: always
    ports:
      - "8002:8002"
    environment:
      TZ: Asia/Shanghai
      MINERU_MODEL_SOURCE: local
      MINERU_API_OUTPUT_ROOT: /output
    entrypoint: mineru-router
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8002"
      - --local-gpus
      - auto
      - --allow-public-http-client
    volumes:
      # 运行时 patch 随 bind mount 更新,改完重启 mineru-router 即可生效
      - ./backend/mineru_api_patch:/app/mineru_api_patch:ro
      - mineru_api_output:/output
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"] # 多卡改成 ["0", "1"] 等
              capabilities: [gpu]
    networks:
      - mineru-network

  redis:
    image: redis:latest
    pull_policy: never
    ports:
      - "6379:6379"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mineru-network

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    pull_policy: never
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - mineru-network

volumes:
  minio_data:
  redis_data:
  mineru_api_output:

networks:
  mineru-network:
    driver: bridge
